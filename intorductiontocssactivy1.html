<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Colour Card</title>
    <style>
       /*Universal Selector-applies changes to evrything in the page*/
        *{
            font-size:16px;
            font-family:Arial, Helvetica, sans-serif;
        }
        /*element selector-Changes the style of all <body> elements*/
            h1{
                color:blue;
                text-align:center;
            }
            h2{
                color:green;
                text-align:center;
            }
            p{
                color:dimgray; 
            }
            /*class selector-Changes the style of all elements with the class name ".my detail"*/
            .mydetail{
                color:darkgoldenrod;
                font-weight:bold;
            }
            /*id selector-Changes the style of the element with the id "mycard"*/
            #mycard{
                background-color:rgb(153, 255, 255);
            }
            </style>
</head>
<body>
    <h1>My Colour Card</h1>
    <h2>My Details</h2>
    <div id="mycard">
        <p class="mydetail">Name: Yugansh Choudhary</p>
        <p class="mydetail">Age: 14</p>
        <p class="mydetail">Class: 9th</p>
        <p class="mydetail">School: Indian High School</p>
    </div>
    
    <h2>My Favourite Things</h2>
    <div id="mycard">
            <p class="mydetail">My favourite colour is Blue</p>
    <p class="mydetail">My favourite food is Pizza</p>
    <p class="mydetail">My favourite sport is Cricket and football</p>
    </div>

</body>
</html>
