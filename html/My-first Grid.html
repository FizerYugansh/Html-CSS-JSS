<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My first Grid</title>
    <link rel="stylesheet"href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"> 
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
<style>
    body{
        background-color: #f9f9f9;
        font-family: Arial, Helvetica, sans-serif;
        padding:30px 15px;
    }
    h1{
        text-align: center;
        color: #ff5a43;
    }
    .hobby-card{
        text-align:center;
        border: 2px solid #ff5a43;
        border-radius: 8px;
        padding: 20px;
        margin: bottom 20px;
        background-color: #fff8e1;
    }
    .hobby-card h3{
        color:#ff5a43;
    }
</style>
</head>
<body>
    <h1>My Hobby Card</h1>
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Drawing</h3>
                    <p>I love Sketching animals and comic characters.</p>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <H3>Football</H3>
                    <p>I play football every evening with my friends</p>

                </div>
            </div>
            <div class="col-12 col md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Reading</h3>
                    <p>My favourite books are books that have fiction, sci fi and mystery or suspense and thinks about different religion</p>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
