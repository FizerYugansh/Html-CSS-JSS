<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Activity</title>
</head>
<body>
    <h1>Array Activity</h1>
    <p id="demo"></p>
    <script>
        var fruits = ["Apple", "Banana", "Cherry", "Date", "Elderberry"];
        document.getElementById("demo").innerHTML = fruits[0];
    </script>
    <!-- new array can be used it needs no name and just set the value such as 5 then only 5 values can be inserted. -->
</body>
</html>
