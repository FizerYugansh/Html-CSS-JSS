<body>
    <button onclick="myfunction(5,10)">Execute Js function</button>
<script>
    function myfunction(x,y)
    {
        if (y===undefined){
            y=2;
        }
        document.write(x*y);
        document.write("\n" );
        document.write(x+y);
    }
</script>
</body>
