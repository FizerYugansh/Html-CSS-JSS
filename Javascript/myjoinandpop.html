<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My first pop and join activity</title>
</head>
<body>
    <h1>My first pop and join activity</h1>
    <p>In this activity, we will learn how to use the pop and join methods in JavaScript.</p>
    <p>The pop method removes the last element from an array and returns that element. The join method joins all elements of an array into a string.
    </p>
    <p id="demo"></p>
    <p id="demo1"></p>
    <p id="demo2"></p>
    <script>
        var fruits = ["Banana", "Orange", "Apple", "Mango"];
        document.getElementById("demo").innerHTML = fruits.join(" , ");
        document.getElementById("demo1").innerHTML = fruits.pop();
        fruits.pop();
        document.getElementById("demo2").innerHTML=fruits;
    </script>
</body>
</html>
